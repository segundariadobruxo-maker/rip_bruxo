        function carregarScripts() {
            const container = document.getElementById('script-list');
            container.innerHTML = '';
            
            scripts.forEach((script, index) => {
                const item = document.createElement('div');
                item.className = 'script-item';
                
                const header = document.createElement('div');
                header.className = 'script-header';
                
                const name = document.createElement('div');
                name.className = 'script-name';
                name.textContent = (index + 1) + '. ' + script.name;
                
                const game = document.createElement('div');
                game.className = 'script-game';
                game.textContent = '🎮 ' + script.game;
                
                const number = document.createElement('div');
                number.className = 'script-number';
                number.textContent = '#' + (index + 1);
                
                header.appendChild(name);
                header.appendChild(game);
                header.appendChild(number);
                
                const desc = document.createElement('div');
                desc.className = 'script-desc';
                desc.textContent = '📌 ' + script.desc;
                
                const code = document.createElement('div');
                code.className = 'script-code';
                code.id = `code-${index}`;
                code.textContent = script.code;
                
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '📋 COPIAR';
                btn.onclick = function() { copiarScript(index); };
                
                item.appendChild(header);
                item.appendChild(desc);
                item.appendChild(code);
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        function copiarScript(index) {
            const texto = scripts[index].code;
            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ SCRIPT COPIADO! Cole no seu executor (Delta, Arceus, etc.)');
            }).catch(() => {
                alert('❌ Erro ao copiar. Copie manualmente.');
            });
        }

        carregarScripts();
    </script>
