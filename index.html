<html lang="pt-br">

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            font-family: 'Poppins', -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: white;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* BOTÃO DO DISCORD */
        .discord-button {
            background: #5865F2;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .discord-button:hover {
            background: #4752c4;
            transform: scale(1.02);
        }

        .count {
            background: rgba(168,85,247,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .script-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .script-item {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px;
            text-align: left;
            border: 1px solid rgba(168,85,247,0.3);
            transition: 0.3s;
        }

        .script-item:hover {
            border-color: rgba(168,85,247,0.8);
            transform: translateY(-2px);
        }

        .script-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #a855f7;
            word-break: break-word;
        }

        .script-code {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid #2a2a4a;
            line-height: 1.4;
        }

        .copy-btn {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            width: 100%;
            max-width: 150px;
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

        ];

        function carregarScripts() {
            const container = document.getElementById('script-list');
            container.innerHTML = '';
            
            scripts.forEach((script, index) => {
                const item = document.createElement('div');
                item.className = 'script-item';
                
                const name = document.createElement('div');
                name.className = 'script-name';
                name.textContent = (index + 1) + '. ' + script.name;
                
                const code = document.createElement('div');
                code.className = 'script-code';
                code.id = `code-${index}`;
                code.textContent = script.code;
                
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = '📋 COPIAR';
                btn.onclick = function() { copiarScript(index); };
                
                item.appendChild(name);
                item.appendChild(code);
                item.appendChild(btn);
                container.appendChild(item);
            });
        }

        function copiarScript(index) {
            const texto = scripts[index].code;
            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ SCRIPT COPIADO! Cole no seu executor (Delta, Arceus, etc.)');
            }).catch(() => {
                alert('❌ Erro ao copiar. Copie manualmente.');
            });
        }

        carregarScripts();
    </script>
